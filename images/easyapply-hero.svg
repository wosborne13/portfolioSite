<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract diagram of a single job-seeker profile connecting to multiple job postings, one flagged as Easy Apply">
  <rect width="1600" height="1000" fill="#ede7dc"/>

  <!-- profile card, left -->
  <rect x="140" y="320" width="360" height="360" fill="#15130f"/>
  <g fill="#ede7dc">
    <rect x="180" y="360" width="280" height="40"/>
    <rect x="180" y="420" width="280" height="40"/>
    <rect x="180" y="480" width="280" height="40"/>
    <rect x="180" y="540" width="180" height="40"/>
    <rect x="180" y="600" width="220" height="40"/>
  </g>

  <!-- connecting lines to job postings -->
  <g stroke="#15130f" stroke-width="2" fill="none">
    <path d="M500,400 C 700,380 850,300 1080,260"/>
    <path d="M500,470 C 700,470 850,470 1080,480"/>
    <path d="M500,560 C 700,600 850,660 1080,700"/>
  </g>

  <!-- job posting cards, right -->
  <rect x="1080" y="180" width="380" height="160" fill="none" stroke="#15130f" stroke-width="3"/>
  <rect x="1080" y="400" width="380" height="160" fill="#d6371f"/>
  <rect x="1080" y="620" width="380" height="160" fill="none" stroke="#15130f" stroke-width="3"/>

  <g fill="#15130f">
    <rect x="1120" y="220" width="220" height="24"/>
    <rect x="1120" y="264" width="140" height="24"/>
  </g>
  <g fill="#ede7dc">
    <rect x="1120" y="440" width="220" height="24"/>
    <rect x="1120" y="484" width="160" height="24"/>
  </g>
  <g fill="#15130f">
    <rect x="1120" y="660" width="220" height="24"/>
    <rect x="1120" y="704" width="140" height="24"/>
  </g>

  <!-- three-click marker on the flagged posting -->
  <circle cx="1420" cy="480" r="26" fill="#ede7dc"/>
  <circle cx="1420" cy="480" r="10" fill="#d6371f"/>
</svg>
