<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract illustration of a balance scale weighing a ballot against a dollar bill">
  <rect width="1600" height="1000" fill="#ede7dc"/>

  <!-- fulcrum -->
  <polygon points="800,780 740,880 860,880" fill="#15130f"/>
  <rect x="770" y="880" width="60" height="20" fill="#15130f"/>

  <!-- pivot post -->
  <rect x="792" y="360" width="16" height="420" fill="#15130f"/>

  <!-- beam -->
  <rect x="330" y="350" width="940" height="20" fill="#15130f" transform="rotate(-6 800 360)"/>

  <!-- left chain + pan: ballot -->
  <g stroke="#15130f" stroke-width="3">
    <line x1="380" y1="390" x2="380" y2="560"/>
    <line x1="470" y1="380" x2="470" y2="560"/>
  </g>
  <ellipse cx="425" cy="580" rx="130" ry="30" fill="none" stroke="#15130f" stroke-width="5"/>
  <rect x="385" y="480" width="80" height="100" fill="#15130f"/>
  <polyline points="405,530 425,550 460,500" fill="none" stroke="#ede7dc" stroke-width="8"/>

  <!-- right chain + pan: dollar -->
  <g stroke="#15130f" stroke-width="3">
    <line x1="1130" y1="330" x2="1130" y2="500"/>
    <line x1="1220" y1="320" x2="1220" y2="500"/>
  </g>
  <ellipse cx="1175" cy="520" rx="130" ry="30" fill="none" stroke="#15130f" stroke-width="5"/>
  <rect x="1120" y="420" width="110" height="90" fill="#d6371f"/>
  <circle cx="1175" cy="465" r="26" fill="none" stroke="#ede7dc" stroke-width="5"/>
</svg>
