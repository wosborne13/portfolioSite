<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract layered diagram representing a Figma library architecture of foundations, components, and patterns">
  <rect width="1200" height="900" fill="#ede7dc"/>

  <!-- foundations: few large blocks -->
  <rect x="140" y="140" width="280" height="140" fill="#15130f"/>
  <rect x="460" y="140" width="280" height="140" fill="#15130f"/>
  <rect x="780" y="140" width="280" height="140" fill="#d6371f"/>

  <!-- components: medium blocks -->
  <rect x="140" y="360" width="170" height="130" fill="#15130f"/>
  <rect x="330" y="360" width="170" height="130" fill="#15130f"/>
  <rect x="520" y="360" width="170" height="130" fill="#15130f"/>
  <rect x="710" y="360" width="170" height="130" fill="#15130f"/>
  <rect x="900" y="360" width="160" height="130" fill="#15130f"/>

  <!-- patterns: many small blocks -->
  <g fill="#15130f">
    <rect x="140" y="570" width="110" height="90"/>
    <rect x="270" y="570" width="110" height="90"/>
    <rect x="400" y="570" width="110" height="90"/>
    <rect x="530" y="570" width="110" height="90"/>
    <rect x="660" y="570" width="110" height="90"/>
    <rect x="790" y="570" width="110" height="90"/>
    <rect x="920" y="570" width="110" height="90"/>
    <rect x="140" y="690" width="110" height="90"/>
    <rect x="270" y="690" width="110" height="90"/>
    <rect x="400" y="690" width="110" height="90"/>
    <rect x="530" y="690" width="110" height="90"/>
    <rect x="660" y="690" width="110" height="90"/>
    <rect x="790" y="690" width="110" height="90"/>
    <rect x="920" y="690" width="110" height="90"/>
  </g>

  <!-- connecting lines showing hierarchy -->
  <g stroke="#15130f" stroke-width="2" stroke-dasharray="4 6">
    <line x1="600" y1="280" x2="600" y2="360"/>
    <line x1="600" y1="490" x2="600" y2="570"/>
  </g>
</svg>
