<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract list of representatives at every level of government, with the user's senator highlighted">
  <rect width="1200" height="900" fill="#e3dbc9"/>

  <g stroke="#15130f" stroke-width="2">
    <line x1="140" y1="230" x2="1060" y2="230"/>
    <line x1="140" y1="370" x2="1060" y2="370"/>
    <line x1="140" y1="510" x2="1060" y2="510"/>
    <line x1="140" y1="650" x2="1060" y2="650"/>
  </g>

  <!-- row 1 -->
  <circle cx="200" cy="160" r="40" fill="#15130f"/>
  <rect x="270" y="140" width="320" height="24" fill="#15130f"/>
  <rect x="270" y="180" width="200" height="18" fill="#15130f" opacity="0.5"/>

  <!-- row 2: highlighted senator -->
  <circle cx="200" cy="300" r="40" fill="#d6371f"/>
  <rect x="270" y="280" width="320" height="24" fill="#d6371f"/>
  <rect x="270" y="320" width="200" height="18" fill="#d6371f" opacity="0.6"/>
  <rect x="900" y="278" width="150" height="44" fill="none" stroke="#d6371f" stroke-width="3"/>

  <!-- row 3 -->
  <circle cx="200" cy="440" r="40" fill="#15130f"/>
  <rect x="270" y="420" width="280" height="24" fill="#15130f"/>
  <rect x="270" y="460" width="200" height="18" fill="#15130f" opacity="0.5"/>

  <!-- row 4 -->
  <circle cx="200" cy="580" r="40" fill="#15130f"/>
  <rect x="270" y="560" width="300" height="24" fill="#15130f"/>
  <rect x="270" y="600" width="200" height="18" fill="#15130f" opacity="0.5"/>
</svg>
