<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract chart of district interview findings, showing resume-only acceptance by district size">
  <rect width="1200" height="900" fill="#ede7dc"/>

  <!-- baseline -->
  <line x1="100" y1="720" x2="1120" y2="720" stroke="#15130f" stroke-width="2"/>

  <!-- small: 1 district, accepted resume-only (outline / exception) -->
  <rect x="130" y="560" width="150" height="150" fill="none" stroke="#d6371f" stroke-width="5"/>

  <!-- medium: 6 districts, declined (filled) -->
  <g fill="#15130f">
    <rect x="440" y="520" width="90" height="90"/>
    <rect x="546" y="520" width="90" height="90"/>
    <rect x="652" y="520" width="90" height="90"/>
    <rect x="440" y="626" width="90" height="90"/>
    <rect x="546" y="626" width="90" height="90"/>
    <rect x="652" y="626" width="90" height="90"/>
  </g>

  <!-- large: 4 districts, declined (filled) -->
  <g fill="#15130f">
    <rect x="820" y="626" width="90" height="90"/>
    <rect x="926" y="626" width="90" height="90"/>
    <rect x="1032" y="626" width="90" height="90"/>
    <rect x="873" y="520" width="90" height="90"/>
  </g>
</svg>
