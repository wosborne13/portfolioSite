<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract composition showing scattered, unrelated shapes resolving into an ordered grid of components, representing the Backpack design system">
  <rect width="1600" height="1000" fill="#ede7dc"/>

  <!-- left: fragmented, unrelated shapes -->
  <g fill="#15130f">
    <rect x="90" y="150" width="120" height="80" transform="rotate(-8 150 190)"/>
    <circle cx="330" cy="220" r="55"/>
    <rect x="150" y="330" width="90" height="140" transform="rotate(6 195 400)"/>
    <polygon points="360,360 460,340 440,460 340,470"/>
    <rect x="110" y="520" width="160" height="60" transform="rotate(-4 190 550)"/>
    <circle cx="420" cy="600" r="40"/>
    <rect x="180" y="660" width="100" height="180" transform="rotate(10 230 750)"/>
    <polygon points="330,700 430,680 420,780 320,800"/>
    <rect x="90" y="860" width="200" height="70" transform="rotate(-5 190 895)"/>
  </g>

  <!-- divider -->
  <line x1="740" y1="80" x2="740" y2="920" stroke="#15130f" stroke-width="2" stroke-dasharray="2 14"/>

  <!-- right: ordered grid of uniform component swatches -->
  <g>
    <rect x="820" y="140" width="140" height="140" fill="#15130f"/>
    <rect x="980" y="140" width="140" height="140" fill="#15130f"/>
    <rect x="1140" y="140" width="140" height="140" fill="#d6371f"/>
    <rect x="1300" y="140" width="140" height="140" fill="#15130f"/>

    <rect x="820" y="300" width="140" height="140" fill="#15130f"/>
    <rect x="980" y="300" width="140" height="140" fill="#15130f"/>
    <rect x="1140" y="300" width="140" height="140" fill="#15130f"/>
    <rect x="1300" y="300" width="140" height="140" fill="#15130f"/>

    <rect x="820" y="460" width="140" height="140" fill="#15130f"/>
    <rect x="980" y="460" width="140" height="140" fill="#15130f"/>
    <rect x="1140" y="460" width="140" height="140" fill="#15130f"/>
    <rect x="1300" y="460" width="140" height="140" fill="#15130f"/>

    <rect x="820" y="620" width="140" height="140" fill="#15130f"/>
    <rect x="980" y="620" width="140" height="140" fill="#15130f"/>
    <rect x="1140" y="620" width="140" height="140" fill="#15130f"/>
    <rect x="1300" y="620" width="140" height="140" fill="#15130f"/>

    <rect x="820" y="780" width="140" height="140" fill="#15130f"/>
    <rect x="980" y="780" width="140" height="140" fill="#15130f"/>
    <rect x="1140" y="780" width="140" height="140" fill="#15130f"/>
    <rect x="1300" y="780" width="140" height="140" fill="#15130f"/>
  </g>
</svg>
