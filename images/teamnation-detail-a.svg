<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract comparison of a fluctuating Readiness line, coach-facing, against a steadily climbing Points bar, player-facing">
  <rect width="1200" height="900" fill="#ede7dc"/>

  <!-- top: Readiness, fluctuating -->
  <g>
    <rect x="100" y="120" width="1000" height="300" fill="none" stroke="#15130f" stroke-width="2"/>
    <line x1="160" y1="370" x2="1040" y2="370" stroke="#15130f" stroke-width="1" stroke-dasharray="4 10"/>
    <polyline points="160,300 300,220 440,320 580,180 720,300 860,240 1000,280"
      fill="none" stroke="#15130f" stroke-width="6"/>
    <circle cx="160" cy="300" r="9" fill="#15130f"/>
    <circle cx="300" cy="220" r="9" fill="#15130f"/>
    <circle cx="440" cy="320" r="9" fill="#15130f"/>
    <circle cx="580" cy="180" r="9" fill="#15130f"/>
    <circle cx="720" cy="300" r="9" fill="#15130f"/>
    <circle cx="860" cy="240" r="9" fill="#15130f"/>
    <circle cx="1000" cy="280" r="9" fill="#15130f"/>
  </g>

  <!-- bottom: Points, cumulative -->
  <g fill="#d6371f">
    <rect x="160" y="700" width="90" height="80"/>
    <rect x="290" y="650" width="90" height="130"/>
    <rect x="420" y="590" width="90" height="190"/>
    <rect x="550" y="520" width="90" height="260"/>
    <rect x="680" y="440" width="90" height="340"/>
    <rect x="810" y="350" width="90" height="430"/>
    <rect x="940" y="250" width="90" height="530"/>
  </g>
  <line x1="100" y1="780" x2="1040" y2="780" stroke="#15130f" stroke-width="2"/>
</svg>
