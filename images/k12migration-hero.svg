<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract flow diagram showing a tangled multi-step branching flow on the left resolving into a short, direct flow on the right">
  <rect width="1600" height="1000" fill="#ede7dc"/>

  <!-- left: tangled multi-branch flow -->
  <g stroke="#15130f" stroke-width="2" fill="none">
    <line x1="150" y1="150" x2="260" y2="230"/>
    <line x1="150" y1="150" x2="150" y2="260"/>
    <line x1="260" y1="230" x2="220" y2="340"/>
    <line x1="260" y1="230" x2="340" y2="330"/>
    <line x1="150" y1="260" x2="150" y2="380"/>
    <line x1="220" y1="340" x2="180" y2="450"/>
    <line x1="340" y1="330" x2="360" y2="450"/>
    <line x1="150" y1="380" x2="260" y2="470"/>
    <line x1="180" y1="450" x2="200" y2="570"/>
    <line x1="360" y1="450" x2="330" y2="580"/>
    <line x1="260" y1="470" x2="270" y2="600"/>
    <line x1="200" y1="570" x2="240" y2="700"/>
    <line x1="330" y1="580" x2="290" y2="710"/>
    <line x1="270" y1="600" x2="270" y2="720"/>
  </g>
  <g fill="#15130f">
    <rect x="130" y="130" width="40" height="40"/>
    <rect x="240" y="210" width="40" height="40"/>
    <rect x="130" y="240" width="40" height="40"/>
  </g>
  <g fill="#d6371f">
    <rect x="200" y="320" width="40" height="40"/>
    <rect x="320" y="310" width="40" height="40"/>
    <rect x="130" y="360" width="40" height="40"/>
  </g>
  <g fill="#15130f">
    <rect x="160" y="430" width="40" height="40"/>
    <rect x="340" y="430" width="40" height="40"/>
    <rect x="240" y="450" width="40" height="40"/>
    <rect x="180" y="550" width="40" height="40"/>
    <rect x="310" y="560" width="40" height="40"/>
    <rect x="250" y="580" width="40" height="40"/>
    <rect x="220" y="680" width="40" height="40"/>
    <rect x="270" y="690" width="40" height="40"/>
    <rect x="250" y="700" width="40" height="40"/>
  </g>

  <!-- arrow from chaos to order -->
  <path d="M470,500 L 900,500" stroke="#15130f" stroke-width="3" fill="none"/>
  <polygon points="900,500 870,486 870,514" fill="#15130f"/>

  <!-- right: short, direct flow -->
  <g stroke="#15130f" stroke-width="3" fill="none">
    <line x1="1030" y1="500" x2="1230" y2="500"/>
    <line x1="1400" y1="500" x2="1470" y2="500"/>
  </g>
  <rect x="980" y="460" width="100" height="80" fill="#15130f"/>
  <rect x="1250" y="460" width="100" height="80" fill="#d6371f"/>
  <rect x="1400" y="460" width="150" height="80" fill="#15130f"/>
</svg>
