<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract composition of a fluctuating line and a steadily climbing bar chart side by side, representing the split between Readiness and cumulative points">
  <rect width="1600" height="1000" fill="#ede7dc"/>

  <!-- left: fluctuating Readiness line -->
  <g>
    <line x1="140" y1="850" x2="140" y2="150" stroke="#15130f" stroke-width="2"/>
    <line x1="140" y1="850" x2="700" y2="850" stroke="#15130f" stroke-width="2"/>
    <polyline points="140,600 220,420 300,520 380,320 460,460 540,260 620,380 700,300"
      fill="none" stroke="#15130f" stroke-width="6"/>
    <circle cx="700" cy="300" r="12" fill="#15130f"/>
  </g>

  <!-- divider -->
  <line x1="800" y1="80" x2="800" y2="920" stroke="#15130f" stroke-width="2" stroke-dasharray="2 14"/>

  <!-- right: steadily climbing points bars -->
  <g fill="#d6371f">
    <rect x="900" y="760" width="70" height="90"/>
    <rect x="1000" y="680" width="70" height="170"/>
    <rect x="1100" y="580" width="70" height="270"/>
    <rect x="1200" y="460" width="70" height="390"/>
    <rect x="1300" y="320" width="70" height="530"/>
    <rect x="1400" y="180" width="70" height="670"/>
  </g>
  <line x1="860" y1="850" x2="1500" y2="850" stroke="#15130f" stroke-width="2"/>
</svg>
