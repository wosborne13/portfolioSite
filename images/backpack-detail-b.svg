<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract exploded-view diagram of a single component annotated with measurement lines, representing a detailed spec">
  <rect width="1200" height="900" fill="#ede7dc"/>

  <!-- the component -->
  <rect x="420" y="290" width="360" height="320" fill="#15130f"/>
  <rect x="420" y="290" width="360" height="70" fill="#d6371f"/>

  <!-- measurement lines: top -->
  <line x1="420" y1="220" x2="420" y2="270" stroke="#15130f" stroke-width="2"/>
  <line x1="780" y1="220" x2="780" y2="270" stroke="#15130f" stroke-width="2"/>
  <line x1="420" y1="235" x2="780" y2="235" stroke="#15130f" stroke-width="2"/>
  <polygon points="420,235 434,228 434,242" fill="#15130f"/>
  <polygon points="780,235 766,228 766,242" fill="#15130f"/>

  <!-- measurement lines: left -->
  <line x1="350" y1="290" x2="400" y2="290" stroke="#15130f" stroke-width="2"/>
  <line x1="350" y1="610" x2="400" y2="610" stroke="#15130f" stroke-width="2"/>
  <line x1="365" y1="290" x2="365" y2="610" stroke="#15130f" stroke-width="2"/>
  <polygon points="365,290 358,304 372,304" fill="#15130f"/>
  <polygon points="365,610 358,596 372,596" fill="#15130f"/>

  <!-- measurement lines: right, calling out header height -->
  <line x1="800" y1="290" x2="850" y2="290" stroke="#15130f" stroke-width="2"/>
  <line x1="800" y1="360" x2="850" y2="360" stroke="#15130f" stroke-width="2"/>
  <line x1="835" y1="290" x2="835" y2="360" stroke="#15130f" stroke-width="2"/>
  <polygon points="835,290 828,304 842,304" fill="#15130f"/>
  <polygon points="835,360 828,346 842,346" fill="#15130f"/>

  <!-- state swatches -->
  <g>
    <rect x="420" y="660" width="80" height="50" fill="none" stroke="#15130f" stroke-width="2"/>
    <rect x="520" y="660" width="80" height="50" fill="#15130f"/>
    <rect x="620" y="660" width="80" height="50" fill="none" stroke="#d6371f" stroke-width="2"/>
    <rect x="720" y="660" width="80" height="50" fill="#15130f" opacity="0.4"/>
  </g>
</svg>
