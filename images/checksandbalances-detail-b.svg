<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract progress tracker showing votes for and against an issue accumulating in real time">
  <rect width="1200" height="900" fill="#ede7dc"/>

  <!-- for / against bars -->
  <g>
    <rect x="200" y="200" width="340" height="80" fill="none" stroke="#15130f" stroke-width="3"/>
    <rect x="200" y="200" width="255" height="80" fill="#15130f"/>

    <rect x="660" y="200" width="340" height="80" fill="none" stroke="#15130f" stroke-width="3"/>
    <rect x="660" y="200" width="95" height="80" fill="#d6371f"/>
  </g>

  <!-- ticking values -->
  <g fill="#15130f">
    <rect x="200" y="330" width="120" height="20"/>
    <rect x="880" y="330" width="120" height="20"/>
  </g>

  <!-- live activity feed -->
  <g stroke="#15130f" stroke-width="2">
    <line x1="200" y1="470" x2="1000" y2="470"/>
    <line x1="200" y1="560" x2="1000" y2="560"/>
    <line x1="200" y1="650" x2="1000" y2="650"/>
  </g>
  <circle cx="220" cy="440" r="10" fill="#d6371f"/>
  <circle cx="220" cy="530" r="10" fill="#15130f"/>
  <circle cx="220" cy="620" r="10" fill="#15130f"/>
  <g fill="#15130f">
    <rect x="260" y="432" width="500" height="16"/>
    <rect x="260" y="522" width="440" height="16" opacity="0.7"/>
    <rect x="260" y="612" width="470" height="16" opacity="0.7"/>
  </g>
</svg>
