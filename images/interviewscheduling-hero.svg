<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract composition of scattered individual contacts on the left resolving into a single locked calendar block with automatic confirmations on the right">
  <rect width="1600" height="1000" fill="#ede7dc"/>

  <!-- left: scattered individual coordination -->
  <g>
    <circle cx="400" cy="500" r="24" fill="#15130f"/>
    <g stroke="#15130f" stroke-width="2" fill="none">
      <line x1="400" y1="500" x2="180" y2="260" stroke-dasharray="1 1"/>
      <line x1="400" y1="500" x2="640" y2="220"/>
      <line x1="400" y1="500" x2="660" y2="440" stroke-dasharray="8 10"/>
      <line x1="400" y1="500" x2="200" y2="660" stroke-dasharray="1 1"/>
      <line x1="400" y1="500" x2="560" y2="760"/>
      <line x1="400" y1="500" x2="260" y2="480" stroke-dasharray="8 10"/>
    </g>
    <g fill="none" stroke="#15130f" stroke-width="2">
      <circle cx="180" cy="260" r="14"/>
      <circle cx="640" cy="220" r="14"/>
      <circle cx="660" cy="440" r="14"/>
      <circle cx="200" cy="660" r="14"/>
      <circle cx="560" cy="760" r="14"/>
      <circle cx="260" cy="480" r="14"/>
    </g>
  </g>

  <!-- divider -->
  <line x1="800" y1="80" x2="800" y2="920" stroke="#15130f" stroke-width="2" stroke-dasharray="2 14"/>

  <!-- right: locked block calendar -->
  <g>
    <g fill="none" stroke="#15130f" stroke-width="3">
      <rect x="940" y="200" width="110" height="110"/>
      <rect x="940" y="330" width="110" height="110"/>
      <rect x="940" y="460" width="110" height="110"/>
      <rect x="940" y="590" width="110" height="110"/>
      <rect x="1070" y="200" width="110" height="110"/>
      <rect x="1070" y="330" width="110" height="110"/>
      <rect x="1070" y="460" width="110" height="110"/>
      <rect x="1070" y="590" width="110" height="110"/>
      <rect x="1330" y="200" width="110" height="110"/>
      <rect x="1330" y="330" width="110" height="110"/>
      <rect x="1330" y="460" width="110" height="110"/>
      <rect x="1330" y="590" width="110" height="110"/>
    </g>
    <g fill="#d6371f">
      <rect x="1200" y="200" width="110" height="110"/>
      <rect x="1200" y="330" width="110" height="110"/>
      <rect x="1200" y="460" width="110" height="110"/>
      <rect x="1200" y="590" width="110" height="110"/>
    </g>
    <g stroke="#15130f" stroke-width="2" fill="none">
      <line x1="1200" y1="720" x2="1150" y2="820"/>
      <line x1="1255" y1="720" x2="1255" y2="820"/>
      <line x1="1310" y1="720" x2="1360" y2="820"/>
    </g>
    <g fill="#d6371f">
      <circle cx="1150" cy="835" r="12"/>
      <circle cx="1255" cy="835" r="12"/>
      <circle cx="1360" cy="835" r="12"/>
    </g>
  </g>
</svg>
