<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract mobile leaderboard layout with the top four positions spotlighted and the remaining players arranged relative to the pack">
  <rect width="1200" height="900" fill="#ede7dc"/>

  <!-- phone frame -->
  <rect x="360" y="60" width="480" height="780" rx="36" fill="none" stroke="#15130f" stroke-width="3"/>

  <!-- top four spotlight row -->
  <g>
    <rect x="400" y="120" width="90" height="150" fill="#d6371f"/>
    <rect x="500" y="150" width="90" height="120" fill="#15130f"/>
    <rect x="600" y="150" width="90" height="120" fill="#15130f"/>
    <rect x="700" y="170" width="90" height="100" fill="#15130f"/>
  </g>

  <!-- divider -->
  <line x1="400" y1="310" x2="790" y2="310" stroke="#15130f" stroke-width="2" stroke-dasharray="2 10"/>

  <!-- player-relative pack view -->
  <g fill="#15130f">
    <rect x="400" y="360" width="390" height="34" opacity="0.6"/>
    <rect x="400" y="410" width="390" height="34" opacity="0.85"/>
    <rect x="400" y="460" width="390" height="34"/>
    <rect x="400" y="510" width="390" height="34" opacity="0.85"/>
    <rect x="400" y="560" width="390" height="34" opacity="0.6"/>
    <rect x="400" y="610" width="390" height="34" opacity="0.4"/>
    <rect x="400" y="660" width="390" height="34" opacity="0.25"/>
  </g>
  <line x1="400" y1="477" x2="790" y2="477" stroke="#d6371f" stroke-width="3"/>
</svg>
