<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract diagram of an email-first routing model, with one user input and system-side branching to three destinations">
  <rect width="1200" height="900" fill="#ede7dc"/>

  <!-- single input -->
  <rect x="500" y="120" width="200" height="90" fill="#15130f"/>
  <circle cx="600" cy="165" r="14" fill="#ede7dc"/>

  <!-- system-side branching (dashed, invisible to user) -->
  <g stroke="#15130f" stroke-width="2" fill="none" stroke-dasharray="6 8">
    <path d="M600,210 C 600,320 300,320 300,430"/>
    <path d="M600,210 L 600,430"/>
    <path d="M600,210 C 600,320 900,320 900,430"/>
  </g>

  <!-- three destination screens -->
  <rect x="220" y="430" width="160" height="90" fill="none" stroke="#15130f" stroke-width="3"/>
  <rect x="520" y="430" width="160" height="90" fill="#d6371f"/>
  <rect x="820" y="430" width="160" height="90" fill="none" stroke="#15130f" stroke-width="3"/>

  <g fill="#15130f">
    <rect x="250" y="460" width="100" height="16"/>
    <rect x="850" y="460" width="100" height="16"/>
  </g>
  <g fill="#ede7dc">
    <rect x="550" y="460" width="100" height="16"/>
  </g>
</svg>
