<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract diagram of the shipped flow, showing a two-screen sign-in path and a three-screen creation path with a wrong-guess redirect between them">
  <rect width="1200" height="900" fill="#ede7dc"/>

  <!-- entry point -->
  <rect x="500" y="80" width="200" height="80" fill="#15130f"/>

  <g stroke="#15130f" stroke-width="2" fill="none">
    <line x1="560" y1="160" x2="330" y2="260"/>
    <line x1="640" y1="160" x2="870" y2="260"/>
  </g>

  <!-- sign-in path: 2 screens -->
  <rect x="250" y="260" width="160" height="80" fill="#15130f"/>
  <line x1="330" y1="340" x2="330" y2="420" stroke="#15130f" stroke-width="2"/>
  <rect x="250" y="420" width="160" height="80" fill="#15130f"/>

  <!-- create-account path: 3 screens -->
  <rect x="790" y="260" width="160" height="80" fill="#15130f"/>
  <line x1="870" y1="340" x2="870" y2="420" stroke="#15130f" stroke-width="2"/>
  <rect x="790" y="420" width="160" height="80" fill="#15130f"/>
  <line x1="870" y1="500" x2="870" y2="580" stroke="#15130f" stroke-width="2"/>
  <rect x="790" y="580" width="160" height="80" fill="#15130f"/>

  <!-- wrong-guess redirect, dashed cross path -->
  <path d="M410,460 C 550,460 550,540 790,540" stroke="#d6371f" stroke-width="3" fill="none" stroke-dasharray="8 10"/>
  <polygon points="790,540 764,528 764,552" fill="#d6371f"/>
  <path d="M950,300 C 1080,300 1080,180 700,120" stroke="#d6371f" stroke-width="3" fill="none" stroke-dasharray="8 10"/>
  <polygon points="700,120 727,132 723,108" fill="#d6371f"/>
</svg>
